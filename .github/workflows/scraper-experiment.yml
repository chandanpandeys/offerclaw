name: Scraper Experiment

on:
  push:
    branches: [master]
    paths:
      - 'experiments/scrapers/scrapling/**'
      - '.github/workflows/scraper-experiment.yml'
  pull_request:
    branches: [master]
    paths:
      - 'experiments/scrapers/scrapling/**'
      - '.github/workflows/scraper-experiment.yml'

permissions:
  contents: read

concurrency:
  group: scraper-experiment-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixture-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: experiments/scrapers/scrapling

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: experiments/scrapers/scrapling/requirements.txt

      - name: Install experiment dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run offline extractor and decision tests
        run: python -m unittest test_extract.py test_decision.py
