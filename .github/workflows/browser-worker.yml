name: Browser Worker

on:
  push:
    branches: [master]
    paths:
      - 'services/browser-worker/**'
      - '.github/workflows/browser-worker.yml'
  pull_request:
    branches: [master]
    paths:
      - 'services/browser-worker/**'
      - '.github/workflows/browser-worker.yml'

permissions:
  contents: read

concurrency:
  group: browser-worker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: services/browser-worker

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/browser-worker/package.json

      - name: Install worker dependencies
        run: npm install --no-audit --no-fund

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run worker tests
        run: npm test
